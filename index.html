<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPDev | Разработка плагинов Minecraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0D0D0D 0%, #1A1A1A 50%, #0D0D0D 100%);
            font-family: 'Segoe UI', 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(2px 2px at 20% 30%, rgba(245,166,35,0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(0,255,255,0.2), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(245,166,35,0.3), transparent),
                radial-gradient(2px 2px at 80% 60%, rgba(0,255,255,0.2), transparent),
                radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.1), transparent),
                radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.1), transparent);
            animation: floatParticles 15s ease-in-out infinite;
        }
        
        @keyframes floatParticles {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .container {
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            position: relative;
            border-radius: 35px;
            background: linear-gradient(45deg, #F5A623, #FFD700, #00FFFF, #F5A623);
            background-size: 300% 300%;
            animation: avatarGlow 4s ease-in-out infinite;
            padding: 3px;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            background: linear-gradient(145deg, #2D2D2D, #1A1A1A);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.05);
        }
        
        @keyframes avatarGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .info-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 30px 25px;
            margin-bottom: 20px;
        }
        
        .logo-text {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #F5A623, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #888;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        
        .description {
            color: #B0B0B0;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 0;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
        }
        
        .btn-telegram {
            background: linear-gradient(135deg, #2AABEE, #229ED9);
            color: white;
            box-shadow: 0 10px 30px rgba(42,171,238,0.3);
        }
        .btn-telegram:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(42,171,238,0.5);
        }
        
        .btn-gold {
            background: linear-gradient(135deg, #F5A623, #E8961A);
            color: #1A1A1A;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(245,166,35,0.4);
        }
        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(245,166,35,0.6);
        }
        
        .btn-social {
            background: linear-gradient(135deg, #6C5CE7, #A855F7);
            color: white;
            box-shadow: 0 10px 30px rgba(108,92,231,0.3);
        }
        .btn-social:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(108,92,231,0.5);
        }
        
        .icon {
            font-size: 22px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }
        .divider-text {
            color: #555;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .footer {
            color: #444;
            font-size: 12px;
            margin-top: 25px;
        }
        .footer a {
            color: #F5A623;
            text-decoration: none;
        }
        
        @media (max-width: 480px) {
            .container { max-width: 100%; }
            .btn { padding: 16px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="avatar-wrapper">
            <div class="avatar">🍟</div>
        </div>
        
        <div class="info-card">
            <div class="logo-text">Fried Projects</div>
            <div class="subtitle">FPDev • Plugin Studio</div>
            <p class="description">
                Разрабатываем плагины для Minecraft на Spigot/Paper.<br>
                Кастомные механики, оптимизация, интеграции.
            </p>
        </div>
        
        <div class="buttons">
            <a href="https://t.me/dikunovvv" class="btn btn-telegram">
                <span class="icon">⚙️</span> Заказать плагин в Telegram
                <span style="margin-left: auto; opacity: 0.8; font-size: 13px;">@dikunovvv</span>
            </a>
            
            <a href="https://t.me/dikunovvv" class="btn btn-gold">
                <span class="icon">🛒</span> Другие товары
                <span style="margin-left: auto; opacity: 0.8; font-size: 13px;">Перевод плагина — 300 ₽</span>
            </a>
            
            <a href="https://t.me/dev_minecraft" class="btn btn-social">
                <span class="icon">📱</span> Соц-сети
                <span style="margin-left: auto; opacity: 0.8; font-size: 13px;">@dev_minecraft</span>
            </a>
        </div>
        
        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-text">Связь</div>
            <div class="divider-line"></div>
        </div>
        
        <div class="footer">
            © 2025 <a href="https://fried.webtm.ru">FPDev</a> • Все права защищены
        </div>
        
    </div>
</body>
</html>
